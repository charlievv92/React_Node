version: "3.8"

services:
  frontend:
    image: 172.30.1.20:5000/react-node-front:latest
    ports:
      - "80:80"
    env_file:
      - ./board_front/.env
    depends_on:
      - backend

  backend:
    image: 172.30.1.20:5000/react-node-back:latest
    ports:
      - "8000:8000"
    env_file:
      - ./board_back/.env
    volumes:
      - ./board_back/public/uploads:/app/public/uploads
    depends_on:
      - db

  db:
    image: mysql:8.0
    ports:
      - "3306"
    environment:
      - MYSQL_ROOT_PASSWORD="dev241101!@34"
      - MYSQL_DATABASE="test"
      - MYSQL_USER="root"
      - MYSQL_PASSWORD="dev241101!@34"
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci

volumes:
  mysql_data:
